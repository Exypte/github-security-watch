<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="alternate" type="application/rss+xml" title="GitHub security watch" href="{{prefix}}feed.xml">
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
    --accent: #0969da; --panel: #f6f8fa; --add: #1a7f37; --del: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d;
      --accent: #4493f8; --panel: #151b23; --add: #3fb950; --del: #f85149;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { border-bottom: 1px solid var(--border); }
  header .wrap { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; padding-top: .9rem; padding-bottom: .9rem; }
  header strong { margin-right: auto; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  main.wrap { padding-bottom: 4rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 1.75rem; margin: 2rem 0 .25rem; }
  h2 { font-size: 1.25rem; margin: 2rem 0 .75rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.05rem; margin: 1.25rem 0 .4rem; }
  .meta { color: var(--muted); font-size: .875rem; }
  .summary { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .25rem 1.25rem 1rem; margin-top: 1.5rem; }
  .summary h2 { border: 0; margin-top: 1rem; }
  .note { background: var(--panel); border-left: 3px solid var(--muted); padding: .5rem .9rem; color: var(--muted); }
  .count { color: var(--muted); font-weight: 400; font-size: 1rem; }
  ul.items, ul.archive { list-style: none; padding: 0; }
  ul.items > li, ul.archive > li { padding: .6rem 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  ul.files { margin: .3rem 0 0; padding-left: 1.1rem; font-size: .9rem; }
  .label, .status { display: inline-block; font-size: .75rem; padding: 0 .45rem; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); margin-left: .25rem; }
  .diff { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; color: var(--muted); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header><div class="wrap">
  <strong><a href="{{prefix}}index.html">GitHub security watch</a></strong>
  <a href="{{prefix}}index.html">Latest</a>
  <a href="{{prefix}}archive.html">Archive</a>
  <a href="{{prefix}}feed.xml">RSS</a>
</div></header>
<main class="wrap">
{{body}}
</main>
</body>
</html>
